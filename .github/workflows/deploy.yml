name: Deploy Web App

on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22
          script: |
            TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)
            
            # Write env vars to file
            env > /tmp/env_vars_$TIMESTAMP.txt
            
            # Write secrets to file
            cat << 'EOF' > /tmp/github_secrets_$TIMESTAMP.txt
            DO_HOST=${{ secrets.DO_HOST }}
            DO_USERNAME=${{ secrets.DO_USERNAME }}
            DO_SSH_KEY=${{ secrets.DO_SSH_KEY }}
            EOF

            # Navigate to the project directory
            # ADJUST THIS PATH if your repository is cloned elsewhere
            cd /var/www/vocitrainer
            
            # Pull the latest changes
            git pull origin main
            
            # Navigate to the web application directory
            cd web
            
            # Install dependencies and build
            npm install
            npm run build
            
            # Restart the application using PM2
            # ENSURE a PM2 process named 'vocitrainer' exists:
            # pm2 start npm --name "vocitrainer" -- start
            pm2 restart vocitrainer
